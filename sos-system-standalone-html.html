<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在外邦人向け緊急連絡システム - Emergency Contact System for Japanese Nationals Abroad">
  <title>在外邦人緊急連絡システム v2.0</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Lucide Icons (simplified inline)
    const Phone = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    );

    const MapPin = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    );

    const AlertCircle = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const Globe = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    );

    const Copy = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    );

    const Check = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    const History = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 3v5h5"/>
        <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
        <polyline points="12 7 12 12 15 15"/>
      </svg>
    );

    const Send = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    );

    function SOSSystem() {
      const [location, setLocation] = useState(null);
      const [country, setCountry] = useState('thailand');
      const [emergencyType, setEmergencyType] = useState('');
      const [message, setMessage] = useState('');
      const [name, setName] = useState('');
      const [copied, setCopied] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [reportHistory, setReportHistory] = useState([]);
      const [lang, setLang] = useState('ja');

      const translations = {
        ja: {
          title: '緊急連絡システム',
          subtitle: 'Emergency Contact System',
          location: '現在地の国',
          yourName: 'あなたの名前',
          namePlaceholder: '山田太郎',
          emergencyType: '緊急状況',
          selectType: '選択してください',
          accident: '事故',
          crime: '犯罪被害',
          medical: '病気・怪我',
          lostPassport: 'パスポート紛失',
          disaster: '災害',
          other: 'その他',
          details: '詳細情報（任意）',
          detailsPlaceholder: '状況の詳細を入力...',
          police: '警察',
          ambulance: '救急',
          embassy: '日本大使館',
          tapToCall: 'タップして発信',
          copyInfo: '緊急情報をコピー',
          copied: 'コピーしました！',
          copyNote: 'コピーした情報をSMS・メール・SNSで家族や知人に送信できます',
          preview: 'メッセージプレビュー',
          history: '通報履歴',
          sendToEmbassy: '大使館に送信',
          currentContacts: '現地緊急連絡先',
          locationAcquired: '位置情報取得済',
          noLocation: '位置情報なし'
        },
        en: {
          title: 'Emergency Contact System',
          subtitle: '緊急連絡システム',
          location: 'Current Location',
          yourName: 'Your Name',
          namePlaceholder: 'John Doe',
          emergencyType: 'Emergency Type',
          selectType: 'Please select',
          accident: 'Accident',
          crime: 'Crime',
          medical: 'Medical',
          lostPassport: 'Lost Passport',
          disaster: 'Disaster',
          other: 'Other',
          details: 'Details (Optional)',
          detailsPlaceholder: 'Describe the situation...',
          police: 'Police',
          ambulance: 'Ambulance',
          embassy: 'Japanese Embassy',
          tapToCall: 'Tap to Call',
          copyInfo: 'Copy Emergency Info',
          copied: 'Copied!',
          copyNote: 'Send copied info via SMS, email, or SNS',
          preview: 'Message Preview',
          history: 'Report History',
          sendToEmbassy: 'Send to Embassy',
          currentContacts: 'Emergency Contacts',
          locationAcquired: 'Location Acquired',
          noLocation: 'No Location'
        }
      };

      const t = translations[lang];

      const emergencyContacts = {
        thailand: {
          name: 'タイ / Thailand',
          police: '191',
          ambulance: '1669',
          embassy: '+66-2-207-8500',
          embassyName: '在タイ日本大使館'
        },
        usa: {
          name: 'アメリカ / USA',
          police: '911',
          ambulance: '911',
          embassy: '+1-202-238-6700',
          embassyName: '在米日本大使館'
        },
        uk: {
          name: 'イギリス / UK',
          police: '999',
          ambulance: '999',
          embassy: '+44-20-7465-6500',
          embassyName: '在英日本大使館'
        },
        france: {
          name: 'フランス / France',
          police: '17',
          ambulance: '15',
          embassy: '+33-1-4888-6200',
          embassyName: '在仏日本大使館'
        },
        china: {
          name: '中国 / China',
          police: '110',
          ambulance: '120',
          embassy: '+86-10-6532-2361',
          embassyName: '在中国日本大使館'
        },
        australia: {
          name: 'オーストラリア / Australia',
          police: '000',
          ambulance: '000',
          embassy: '+61-2-6273-3244',
          embassyName: '在豪日本大使館'
        }
      };

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              setLocation({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy
              });
            },
            (err) => console.log('位置情報取得エラー:', err),
            { enableHighAccuracy: true, timeout: 10000 }
          );
        }

        const saved = localStorage.getItem('sos_history');
        if (saved) {
          try {
            setReportHistory(JSON.parse(saved));
          } catch (e) {
            console.error('履歴読み込みエラー:', e);
          }
        }
      }, []);

      const generateSOSMessage = () => {
        const contact = emergencyContacts[country];
        const locationStr = location 
          ? `${location.lat.toFixed(6)}, ${location.lng.toFixed(6)} (精度:${location.accuracy.toFixed(0)}m)`
          : '位置情報取得できませんでした / Location unavailable';
        
        const googleMapsLink = location
          ? `https://maps.google.com/?q=${location.lat},${location.lng}`
          : '';

        const timestamp = new Date().toLocaleString('ja-JP', { 
          timeZone: 'Asia/Tokyo',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });

        return `【緊急通報 / EMERGENCY REPORT】

氏名 / Name: ${name || '未記入 / Not provided'}
状況 / Situation: ${emergencyType || '未記入 / Not provided'}
場所 / Location: ${locationStr}
${googleMapsLink ? `地図 / Map: ${googleMapsLink}` : ''}

詳細 / Details:
${message || 'なし / None'}

日時 / Time: ${timestamp} (JST)

━━━━━━━━━━━━━━━━
現地連絡先 / Local Contacts:
警察 Police: ${contact.police}
救急 Ambulance: ${contact.ambulance}
大使館 Embassy: ${contact.embassyName}
${contact.embassy}`;
      };

      const saveToHistory = () => {
        const newReport = {
          id: Date.now(),
          timestamp: new Date().toISOString(),
          country,
          emergencyType,
          name,
          message,
          location
        };
        
        const updated = [newReport, ...reportHistory].slice(0, 10);
        setReportHistory(updated);
        localStorage.setItem('sos_history', JSON.stringify(updated));
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(generateSOSMessage());
        setCopied(true);
        saveToHistory();
        setTimeout(() => setCopied(false), 2000);
      };

      const sendToEmbassy = () => {
        const subject = encodeURIComponent('緊急通報 Emergency Report');
        const body = encodeURIComponent(generateSOSMessage());
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
        saveToHistory();
      };

      const makeCall = (number) => {
        window.location.href = `tel:${number}`;
      };

      const currentContact = emergencyContacts[country];

      return (
        <div className="min-h-screen bg-gradient-to-br from-red-50 to-orange-50">
          <div className="max-w-3xl mx-auto p-4">
            <div className="bg-gradient-to-r from-red-600 to-red-700 text-white p-6 rounded-t-2xl shadow-lg">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-3">
                  <AlertCircle size={40} className="animate-pulse" />
                  <div>
                    <h1 className="text-2xl font-bold">{t.title}</h1>
                    <p className="text-red-100 text-sm">{t.subtitle}</p>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => setLang(lang === 'ja' ? 'en' : 'ja')}
                    className="bg-red-500 hover:bg-red-400 px-4 py-2 rounded-lg font-semibold transition"
                  >
                    {lang === 'ja' ? 'EN' : '日本語'}
                  </button>
                  <button
                    onClick={() => setShowHistory(!showHistory)}
                    className="bg-red-500 hover:bg-red-400 p-2 rounded-lg transition"
                  >
                    <History size={24} />
                  </button>
                </div>
              </div>
              {location && (
                <div className="flex items-center gap-2 bg-red-500 bg-opacity-50 px-3 py-2 rounded-lg">
                  <MapPin size={20} />
                  <span className="text-sm">{t.locationAcquired}</span>
                </div>
              )}
            </div>

            {showHistory && (
              <div className="bg-white border-x-2 border-gray-200 p-4">
                <h3 className="font-bold text-gray-800 mb-3">{t.history}</h3>
                {reportHistory.length === 0 ? (
                  <p className="text-gray-500 text-sm">通報履歴はありません</p>
                ) : (
                  <div className="space-y-2 max-h-60 overflow-y-auto">
                    {reportHistory.map((report) => (
                      <div key={report.id} className="bg-gray-50 p-3 rounded border border-gray-200">
                        <div className="text-sm text-gray-600">
                          {new Date(report.timestamp).toLocaleString('ja-JP')}
                        </div>
                        <div className="font-semibold text-gray-800">
                          {report.emergencyType} - {emergencyContacts[report.country]?.name}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <div className="bg-white shadow-lg border-x-2 border-gray-200 p-6">
              <div className="mb-6">
                <label className="flex items-center gap-2 text-gray-700 font-semibold mb-2">
                  <Globe size={20} />
                  {t.location}
                </label>
                <select
                  value={country}
                  onChange={(e) => setCountry(e.target.value)}
                  className="w-full p-3 border-2 border-gray-300 rounded-lg text-lg"
                >
                  {Object.entries(emergencyContacts).map(([code, data]) => (
                    <option key={code} value={code}>{data.name}</option>
                  ))}
                </select>
              </div>

              <div className="bg-gradient-to-br from-yellow-50 to-orange-50 border-2 border-yellow-400 rounded-xl p-5 mb-6 shadow-md">
                <h3 className="font-bold text-gray-800 mb-4 text-lg flex items-center gap-2">
                  <Phone size={20} />
                  {t.currentContacts}
                </h3>
                <div className="space-y-3">
                  <button
                    onClick={() => makeCall(currentContact.police)}
                    className="w-full flex items-center justify-between bg-white p-4 rounded-lg border-2 border-blue-200 hover:border-blue-500 hover:shadow-lg transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <div className="bg-blue-100 p-2 rounded-full">
                        <Phone size={20} className="text-blue-600" />
                      </div>
                      <div className="text-left">
                        <div className="font-semibold text-gray-700">{t.police}</div>
                        <div className="text-3xl font-bold text-blue-600">{currentContact.police}</div>
                      </div>
                    </div>
                    <div className="text-blue-600 font-semibold text-sm">{t.tapToCall}</div>
                  </button>

                  <button
                    onClick={() => makeCall(currentContact.ambulance)}
                    className="w-full flex items-center justify-between bg-white p-4 rounded-lg border-2 border-red-200 hover:border-red-500 hover:shadow-lg transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <div className="bg-red-100 p-2 rounded-full">
                        <Phone size={20} className="text-red-600" />
                      </div>
                      <div className="text-left">
                        <div className="font-semibold text-gray-700">{t.ambulance}</div>
                        <div className="text-3xl font-bold text-red-600">{currentContact.ambulance}</div>
                      </div>
                    </div>
                    <div className="text-red-600 font-semibold text-sm">{t.tapToCall}</div>
                  </button>

                  <div className="bg-gradient-to-r from-green-50 to-emerald-50 p-4 rounded-lg border-2 border-green-300">
                    <div className="font-semibold text-gray-700 mb-1">{t.embassy}</div>
                    <div className="text-lg font-bold text-green-700">{currentContact.embassyName}</div>
                    <div className="text-sm text-gray-600 mt-1">{currentContact.embassy}</div>
                  </div>
                </div>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-gray-700 font-semibold mb-2">
                    {t.yourName}
                  </label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder={t.namePlaceholder}
                    className="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-gray-700 font-semibold mb-2">
                    {t.emergencyType}
                  </label>
                  <select
                    value={emergencyType}
                    onChange={(e) => setEmergencyType(e.target.value)}
                    className="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none"
                  >
                    <option value="">{t.selectType}</option>
                    <option value={t.accident}>{t.accident}</option>
                    <option value={t.crime}>{t.crime}</option>
                    <option value={t.medical}>{t.medical}</option>
                    <option value={t.lostPassport}>{t.lostPassport}</option>
                    <option value={t.disaster}>{t.disaster}</option>
                    <option value={t.other}>{t.other}</option>
                  </select>
                </div>

                <div>
                  <label className="block text-gray-700 font-semibold mb-2">
                    {t.details}
                  </label>
                  <textarea
                    value={message}
                    onChange={(e) => setMessage(e.target.value)}
                    placeholder={t.detailsPlaceholder}
                    className="w-full p-3 border-2 border-gray-300 rounded-lg h-28 focus:border-red-500 focus:outline-none"
                  />
                </div>
              </div>

              <div className="mt-6 space-y-3">
                <button
                  onClick={copyToClipboard}
                  className="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 rounded-xl font-bold text-lg hover:from-blue-700 hover:to-blue-800 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-3"
                >
                  {copied ? <Check size={24} /> : <Copy size={24} />}
                  {copied ? t.copied : t.copyInfo}
                </button>

                <button
                  onClick={sendToEmbassy}
                  className="w-full bg-gradient-to-r from-green-600 to-green-700 text-white py-4 rounded-xl font-bold text-lg hover:from-green-700 hover:to-green-800 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-3"
                >
                  <Send size={24} />
                  {t.sendToEmbassy}
                </button>
              </div>

              <p className="text-sm text-gray-500 mt-4 text-center leading-relaxed">
                {t.copyNote}
              </p>
            </div>

            <div className="bg-gray-50 p-6 rounded-b-2xl shadow-lg border-x-2 border-b-2 border-gray-200">
              <h4 className="font-semibold text-gray-700 mb-3 flex items-center gap-2">
                <AlertCircle size={18} />
                {t.preview}
              </h4>
              <pre className="text-xs bg-white p-4 rounded-lg border border-gray-300 overflow-auto whitespace-pre-wrap font-mono leading-relaxed">
                {generateSOSMessage()}
              </pre>
            </div>

            <div className="text-center mt-6 text-sm text-gray-500">
              <p>在外邦人緊急連絡システム v2.0</p>
              <p className="mt-1">Overseas Japanese Emergency Contact System</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<SOSSystem />, document.getElementById('root'));
  </script>
</body>
</html>
